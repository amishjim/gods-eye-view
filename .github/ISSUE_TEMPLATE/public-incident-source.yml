name: Submit a Public Incident Source
description: Help us find publicly available fire, EMS, police, dispatch, traffic, or emergency incident data.
title: "[Source]: "
labels:
  - source-candidate
body:
  - type: markdown
    attributes:
      value: |
        # Help us find public incident data

        Thanks for helping expand God's Eye View Public Incidents.

        **You do not need to be a developer or understand APIs.**

        If you found a public webpage showing emergency or public-safety incidents, that alone can be useful.

        Please provide what you know and leave optional fields blank if you do not know the answer.

        **Do not guess.**

  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction
      description: What city, county, region, or other jurisdiction does this source cover?
      placeholder: "Example: Fauquier County"
    validations:
      required: true

  - type: input
    id: state_region
    attributes:
      label: State / Province / Region
      placeholder: "Example: Virginia"
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Country
      placeholder: "Example: United States"
      value: "United States"
    validations:
      required: true

  - type: input
    id: agency
    attributes:
      label: Agency or Department
      description: If known, which agency publishes or operates this source?
      placeholder: "Example: County Fire & Rescue / Sheriff's Office / 911 Center"

  - type: checkboxes
    id: incident_types
    attributes:
      label: What kind of information does the source contain?
      description: Select everything that appears to apply.
      options:
        - label: Fire
        - label: EMS / Medical
        - label: Police / Law Enforcement
        - label: Rescue
        - label: Traffic / Crashes
        - label: Road Closures
        - label: Emergency Management
        - label: Wildfire
        - label: Other / Unsure

  - type: input
    id: public_url
    attributes:
      label: Public Source URL
      description: Paste the webpage where you found the information. This is the most important field.
      placeholder: "https://..."
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What did you find?
      description: Tell us what you personally saw when you opened the source.
      placeholder: |
        Example:
        The page shows current fire and EMS calls in a list and on a map. It shows incident type, street, time, and responding units.
    validations:
      required: true

  - type: dropdown
    id: presentation
    attributes:
      label: How is the incident information displayed?
      options:
        - I am not sure
        - List
        - Map
        - List and map
        - Dashboard
        - Downloadable dataset
        - Other

  - type: checkboxes
    id: visible_fields
    attributes:
      label: What information can you see?
      description: Select anything you noticed. You do not need to investigate.
      options:
        - label: Incident type
        - label: Date
        - label: Time
        - label: Status
        - label: Street or address
        - label: Intersection
        - label: Neighborhood or general area
        - label: Map location
        - label: Latitude / longitude
        - label: Responding agency
        - label: Responding units
        - label: Incident number
        - label: Other
        - label: Unsure

  - type: dropdown
    id: current_historical
    attributes:
      label: Does the source appear to contain current or historical incidents?
      options:
        - Unsure
        - Live / Active incidents
        - Current or recent incidents
        - Historical incidents
        - Both current and historical incidents

  - type: textarea
    id: historical
    attributes:
      label: Historical data
      description: If older incidents can be searched or downloaded, tell us what you found and how far back it appears to go.
      placeholder: "Optional"

  - type: input
    id: data_url
    attributes:
      label: Direct API / Feed / Data URL
      description: Optional. If you found a direct machine-readable endpoint, paste it here.
      placeholder: "https://..."

  - type: dropdown
    id: source_type
    attributes:
      label: Technical source type
      description: Optional. If you recognize the format, select it. Otherwise choose Unknown.
      options:
        - Unknown
        - Public active-call page
        - CAD
        - JSON API
        - XML
        - GeoJSON
        - CSV
        - RSS
        - Atom
        - ArcGIS / GIS
        - Socrata / Open Data
        - Downloadable dataset
        - Vendor-hosted public system
        - Other

  - type: input
    id: vendor
    attributes:
      label: Vendor or Platform
      description: Optional. Enter this only if you found evidence identifying the system or vendor.
      placeholder: "Leave blank if unknown"

  - type: textarea
    id: vendor_evidence
    attributes:
      label: Vendor / Platform Evidence
      description: If you identified a vendor or platform, tell us what led you to that conclusion.
      placeholder: "Example: Vendor name appears in the footer of the public incident page."

  - type: dropdown
    id: login_required
    attributes:
      label: Does the source require a login?
      options:
        - No
        - Unsure
        - Yes

  - type: textarea
    id: related_sources
    attributes:
      label: Other useful public sources
      description: Add any related official pages, GIS systems, open-data portals, RSS feeds, historical datasets, or agency pages you found.
      placeholder: |
        One URL per line is helpful.

  - type: textarea
    id: discovery
    attributes:
      label: How did you find this source?
      description: Optional. This can help us improve our source-discovery process.
      placeholder: "Example: County website, Google search, local knowledge, AI-assisted research, etc."

  - type: textarea
    id: notes
    attributes:
      label: Anything else we should know?
      description: Add anything useful that was not covered above.
      placeholder: "Optional"

  - type: checkboxes
    id: verification
    attributes:
      label: Quick verification
      options:
        - label: I opened the Public Source URL and confirmed that it exists.
          required: true
        - label: I believe this information is intentionally available to the general public.
          required: true
        - label: I did not bypass a login, CAPTCHA, paywall, access control, or other security restriction to obtain this information.
          required: true

  - type: markdown
    attributes:
      value: |
        ## What happens next?

        Your submission begins as a **candidate source**.

        We will independently verify the source, jurisdiction, public accessibility, underlying data, provider family, usage restrictions, and technical suitability before treating it as a verified Public Incidents source.

        Thanks for helping us find public incident data.
